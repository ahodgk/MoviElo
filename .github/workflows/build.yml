#file: noinspection SpellCheckingInspection
name: build
on:
  workflow_call:
    inputs:
      version_name:
        required: false
        type: string
        description: 'The version name to tag the image with'
      IMAGE:
        required: false
        type: string
        description: 'The image name to build'
  workflow_dispatch:
    inputs:
      version_name:
        required: false
        type: string
        description: 'The version name to tag the image with'
      IMAGE:
        required: false
        type: string
        description: 'The image name to build'

jobs:


  docker-build:
    permissions:
      contents: read
      packages: write
    runs-on:
      - self-hosted
    steps:
      - name: Self-hosted docker login
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "$DOCKER_PASSWORD" | docker login --username $DOCKER_USERNAME --password-stdin docker.adamhodgkinson.dev

      - name: Check for existing image
        id: existing-image
        uses: javajawa/check-registry-for-image@v3
        with:
          registry: docker.adamhodgkinson.dev  # e.g. https://aws_account_id.dkr.ecr.us-west-2.amazonaws.com
          repository: ${{inputs.IMAGE}}   # my-awesome-project/server
          tag: ${{ github.sha }}

      - name: Set up QEMU
        if: ${{ steps.existing-image.outputs.exists == 'false' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ steps.existing-image.outputs.exists == 'false' }}
        uses: docker/setup-buildx-action@v3

      - name: checkout
        if: ${{ steps.existing-image.outputs.exists == 'false' }}
        uses: actions/checkout@v4.1.2

      - name: Cache turbo build setup
        if: ${{ steps.existing-image.outputs.exists == 'false' }}
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

#      - name: Inject turbo cache
#        uses: reproducible-containers/buildkit-cache-dance@v2 # v2.1.4
#        with:
#          cache-source: .turbo
      - name: Put current date into a variable
        run: echo "NOW=$(date +'%Y-%m-%dT%H:%M:%S')" >> $env:GITHUB_ENV

      - name: build
        if: ${{ steps.existing-image.outputs.exists == 'false' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: |
            docker.adamhodgkinson.dev/${{inputs.IMAGE}}:${{ github.sha }}
            docker.adamhodgkinson.dev/${{inputs.IMAGE}}:DEV
            docker.adamhodgkinson.dev/${{inputs.IMAGE}}:DEV-${{ inputs.version_name }}
            docker.adamhodgkinson.dev/${{inputs.IMAGE}}:latest
            ghcr.io/ahodgk/${{inputs.IMAGE}}:DEV-${{ inputs.version_name }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ARG_BUILD_DATE=${{ env.NOW }}
            ARG_GIT_SHA=${{ github.sha }}
            ARG_VERSION=${{ inputs.version_name }}

      # - name: build
      #   run: docker build --cache-from type=gha --cache-to type=gha,mode=max --platform linux/arm64 -f apps/api/Dockerfile -t docker.adamhodgkinson.dev/${{env.IMAGE}}:DEV -t docker.adamhodgkinson.dev/${{env.IMAGE}}:${{ github.sha }} -t docker.adamhodgkinson.dev/${{env.IMAGE}}:latest .
      - name: Log in to the Github Container registry
        if: ${{ steps.existing-image.outputs.exists == 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


#      - name: ghcr login
#        run: echo ${{ secrets.GHCR_TOKEN}} | docker login ghcr.io -u ahodgk --password-stdin
      - name: docker push
        if: ${{ steps.existing-image.outputs.exists == 'false' }}
        run: |
          docker push docker.adamhodgkinson.dev/${{inputs.IMAGE}} --all-tags
          docker push ghcr.io/ahodgk/${{inputs.IMAGE}} --all-tags
